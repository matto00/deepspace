[/Script/DeepSpace.ProcGenPriorsConfig]
; Every prior the generator draws with, one line each (procgen decision 14).
; A tune is an edit here and `ds.Universe.ReloadPriors` in a running session:
; no rebuild, no restart. Every prior change re-rolls the universe -- that is
; the point of a tune, and nothing persists yet for it to break. The meaning
; of each number is in Source/DeepSpace/Universe/GenPriors.h; what an ini
; must not move (the Hill floor, the mass cap, the kind thresholds) is not
; here at all.
;
; These are the developer's ruling of 2026-09-25: HONEST weights. The solar
; neighbourhood as it is -- three suns in four red dwarfs, gas giants about
; one system in ninety, somebody living in about one system in sixteen.
; This section is the one source of the numbers played; FGenPriors{} is only
; what a missing line falls back to. A value its sampler cannot take -- a
; negative weight, a Poisson mean over 30, a chance above one -- refuses the
; whole section: the priors in use stay, and the log and ReloadPriors name
; the line (GenPriorDomain, in GenPriors.h).

; The star: main-sequence class weights M K G F A B, relative.
ClassWeightM=0.76
ClassWeightK=0.12
ClassWeightG=0.076
ClassWeightF=0.030
ClassWeightA=0.006
ClassWeightB=0.0013
; Where in its class a star sits, Beta(A, B): skewed low, as the IMF is.
ClassBandBetaA=1.2
ClassBandBetaB=2.0

; Planets: Poisson mean of the count.
PlanetCountMean=4.0
; Innermost orbit, log-normal: median factor x sqrt(L) AU, and sigma.
InnermostMedianFactor=0.2
InnermostSigma=0.35
; Neighbour spacing in mutual Hill radii, log-normal (floor 10 is code).
HillSpacingMedian=20.0
HillSpacingSigma=0.4
; Rocky masses, Earth masses, log-normal: inside and beyond the frost line.
RockyMassMedianInner=1.0
RockyMassMedianOuter=2.0
RockyMassSigma=0.9
; Giants beyond the frost line: Chance(min(Max, PerSolarMass x Mstar)), and
; their mass, log-normal in Earth masses. The first knob if it reads drab.
GiantChanceMax=0.5
GiantChancePerSolarMass=0.3
GiantMassMedian=100.0
GiantMassSigma=1.0
; Of temperate worlds: the fraction that are oceans, and the chance anybody
; lives there.
OceanFraction=0.4
InhabitedChance=0.08
; Settlement size, people: log-normal, truncated.
PopulationMedian=50000
PopulationSigma=2.0
PopulationMin=200
PopulationMax=500000000

; The ground (landing decision 3): a crust holds up Strength / g km of relief,
; g in Earth g, weather taking a factor off a terrestrial world's; a world
; reaches a Beta(A, B) share of that. Two caps are code, not lines here: 10 km
; (MaxReliefKm) and 0.5% of the radius (MaxReliefRadiusFraction).
ReliefStrengthRockKm=9.0
ReliefStrengthIceKm=9.0
ReliefTerrestrialFactor=0.7
ReliefBetaA=5.0
ReliefBetaB=2.0
ReliefTerrestrialBetaA=3.0
ReliefTerrestrialBetaB=2.0

; The air (atmospheres decision 2): a temperate world's surface pressure is
; log-normal (median by kind, natural-log sigma), bent under a ceiling that
; is code, not a line here (the world's retention of its gas and
; MaxNadirTau450). Its gas is drawn from these weights times how well the
; world holds each: a world that cannot keep hydrogen never draws it.
AirPressureMedianTerrestrialBar=0.8
AirPressureMedianOceanBar=1.0
AirPressureSigma=0.9
AirMixWeightNitrogenOxygen=0.55
AirMixWeightCarbonDioxide=0.40
AirMixWeightHydrogenHelium=0.05

; The galaxy: Poisson mean of systems per 2^62 cm (~4.9 ly) sector.
SystemsPerSector=0.5

[/Script/DeepSpace.ShipDressingConfig]
; The dressing's tunables (lived-in decision 1c): somebody's things on the
; ship's surfaces. A tune is an edit here and `ds.Dress.Reload` in a running
; session -- no rebuild, no restart, and the ship redresses where you stand.
; List only what is being tuned. The code defaults are in
; Source/DeepSpace/Ship/ShipDressingRules.cpp, with what each number means in
; ShipDressingRules.h; a line missing here falls back to them.
;
; Scalars are one line each, by the field's name:
;   BackA=4.0
;   StackChance=0.5
; The tables are overlays by name: a row replaces the code's entry of the
; same name, or adds a new one, and everything not named stays as coded.
;   +Kinds=(Kind="desk.top",Lambda=2.0)
;       ; no Mix keeps the code's mix for that kind; a Mix replaces it whole
;   +Kinds=(Kind="counter.top",Lambda=4.0,Mix=((Name="mug",Weight=6),(Name="plate",Weight=3)))
;   +Templates=(Name="mug",Parts=((Mesh=Cylinder,At=(X=-1,Y=0,Z=6),Size=(X=8,Y=8,Z=12),Role="ceramic")))
;       ; Mesh is Cube, Chamfer or Cylinder; Role names MI_Ship_<Role>, which
;       ; Tools/build_hauler.py must author; the lowest part rests on Z=0
;   +Colours=(Name="navy",Weight=4)
;   TurnWeights[1]=2.0
;       ; four quarter turns, 0 to 3
; What no line may move -- the Poisson cap, the redraws, containment, the
; excludes, the keep-outs, the clear -- is DressGuarantees, not here. A value
; Dress cannot take (a Beta shape under 0.1, a mean over 7.5, a mix naming no
; template, a part below its surface) refuses the whole section: the rules in
; use stay, and the log and ds.Dress.Reload name the line (DressRuleDomain,
; in ShipDressing.h). ds.Dress.LivedIn and ds.Dress.Seed are console
; variables, not lines here.
